<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THE LAST PLAYER</title>
<style>
html,body{margin:0;height:100%;background:#050607;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#hud{position:fixed;top:10px;left:12px;color:#9aa4ae;font-size:12px;letter-spacing:.15em;pointer-events:none;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>
<div id="grain"></div>
<div id="hud">THE LAST PLAYER · PROTOTYPE v0.1<br>Move: WASD / arrows, or drag your finger</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dx=dk.getContext('2d');
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=dk.width=Math.floor(W*DPR);
  cv.height=dk.height=Math.floor(H*DPR);
}
addEventListener('resize',resize);resize();

const WW=1600,WH=1000;
const walls=[
  {x:0,y:0,w:1600,h:20},{x:0,y:980,w:1600,h:20},
  {x:0,y:0,w:20,h:1000},{x:1580,y:0,w:20,h:1000},
  {x:500,y:20,w:20,h:360},{x:500,y:520,w:20,h:460},
  {x:1000,y:20,w:20,h:260},{x:1000,y:420,w:20,h:560},
  {x:520,y:600,w:180,h:20},{x:820,y:600,w:180,h:20}
];
const crates=[
  {x:200,y:200,w:60,h:60},{x:1200,y:700,w:70,h:70},
  {x:700,y:300,w:50,h:50},{x:1300,y:200,w:60,h:60}
];
const blockers=walls.concat(crates);
const segs=[];
for(const b of blockers){
  segs.push([b.x,b.y,b.x+b.w,b.y],[b.x+b.w,b.y,b.x+b.w,b.y+b.h],
            [b.x+b.w,b.y+b.h,b.x,b.y+b.h],[b.x,b.y+b.h,b.x,b.y]);
}

const p={x:260,y:500,r:12,face:0};
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const joy={on:false,id:null,ox:0,oy:0,cx:0,cy:0};
cv.addEventListener('pointerdown',e=>{
  if(joy.on)return;
  joy.on=true;joy.id=e.pointerId;joy.ox=joy.cx=e.clientX;joy.oy=joy.cy=e.clientY;
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId===joy.id){joy.cx=e.clientX;joy.cy=e.clientY;}
});
function endJoy(e){if(e.pointerId===joy.id){joy.on=false;joy.id=null;}}
cv.addEventListener('pointerup',endJoy);
cv.addEventListener('pointercancel',endJoy);

function cast(px,py,a,maxD){
  const rx=Math.cos(a),ry=Math.sin(a);let best=maxD;
  for(const s of segs){
    const sx=s[2]-s[0],sy=s[3]-s[1];
    const den=rx*sy-ry*sx;
    if(Math.abs(den)<1e-9)continue;
    const t=((s[0]-px)*sy-(s[1]-py)*sx)/den;
    const u=((s[0]-px)*ry-(s[1]-py)*rx)/den;
    if(t>0&&t<best&&u>=0&&u<=1)best=t;
  }
  return best;
}
function fan(px,py,a0,a1,n,maxD){
  const pts=[];
  for(let i=0;i<=n;i++){
    const a=a0+(a1-a0)*i/n;
    const d=cast(px,py,a,maxD);
    pts.push([px+Math.cos(a)*d,py+Math.sin(a)*d]);
  }
  return pts;
}
function punch(pts,px,py,r,alpha){
  dx.beginPath();dx.moveTo(px,py);
  for(const q of pts)dx.lineTo(q[0],q[1]);
  dx.closePath();
  const g=dx.createRadialGradient(px,py,0,px,py,r);
  g.addColorStop(0,'rgba(0,0,0,'+alpha+')');
  g.addColorStop(1,'rgba(0,0,0,0)');
  dx.fillStyle=g;dx.fill();
}
function resolve(){
  for(const b of blockers){
    const cx=Math.max(b.x,Math.min(p.x,b.x+b.w));
    const cy=Math.max(b.y,Math.min(p.y,b.y+b.h));
    const ox=p.x-cx,oy=p.y-cy,d=Math.hypot(ox,oy);
    if(d<p.r){
      if(d>0.0001){p.x+=ox/d*(p.r-d);p.y+=oy/d*(p.r-d);}
      else p.x+=p.r;
    }
  }
}

let last=performance.now(),flickT=0,fl=1;
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  let vx=0,vy=0;
  if(keys['a']||keys['arrowleft'])vx-=1;
  if(keys['d']||keys['arrowright'])vx+=1;
  if(keys['w']||keys['arrowup'])vy-=1;
  if(keys['s']||keys['arrowdown'])vy+=1;
  if(joy.on){
    const jx=(joy.cx-joy.ox)/50,jy=(joy.cy-joy.oy)/50,m=Math.hypot(jx,jy);
    if(m>0.15){vx=jx/Math.max(m,1);vy=jy/Math.max(m,1);}
  }
  const m=Math.hypot(vx,vy);
  if(m>1){vx/=m;vy/=m;}
  if(m>0.01){
    p.x+=vx*190*dt;p.y+=vy*190*dt;resolve();
    const t=Math.atan2(vy,vx);
    const diff=((t-p.face+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    p.face+=diff*Math.min(1,dt*10);
  }
  if(flickT<=0&&Math.random()<0.004)flickT=0.15;
  if(flickT>0){flickT-=dt;fl=0.35+Math.random()*0.4;}else fl=1;

  const camx=p.x-W/2,camy=p.y-H/2;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#050607';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,-camx*DPR,-camy*DPR);
  ctx.fillStyle='#14181c';ctx.fillRect(0,0,WW,WH);
  ctx.strokeStyle='#1c2228';ctx.lineWidth=2;ctx.beginPath();
  for(let x=0;x<=WW;x+=80){ctx.moveTo(x,0);ctx.lineTo(x,WH);}
  for(let y=0;y<=WH;y+=80){ctx.moveTo(0,y);ctx.lineTo(WW,y);}
  ctx.stroke();
  for(const b of crates){
    ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(b.x+6,b.y+8,b.w,b.h);
    ctx.fillStyle='#4a3b2d';ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#6b5642';ctx.lineWidth=3;ctx.strokeRect(b.x+2,b.y+2,b.w-4,b.h-4);
  }
  for(const b of walls){
    ctx.fillStyle='#2b333c';ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle='#44505c';ctx.lineWidth=2;ctx.strokeRect(b.x,b.y,b.w,b.h);
  }
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath();ctx.ellipse(p.x+3,p.y+5,p.r,p.r*0.8,0,0,7);ctx.fill();
  ctx.fillStyle='#c9d3dc';
  ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  ctx.fillStyle='#7d8a96';
  ctx.beginPath();ctx.arc(p.x+Math.cos(p.face)*p.r*0.6,p.y+Math.sin(p.face)*p.r*0.6,4,0,7);ctx.fill();

  dx.globalCompositeOperation='source-over';
  dx.setTransform(1,0,0,1,0,0);
  dx.fillStyle='rgba(2,3,5,0.97)';
  dx.fillRect(0,0,dk.width,dk.height);
  dx.setTransform(DPR,0,0,DPR,-camx*DPR,-camy*DPR);
  dx.globalCompositeOperation='destination-out';
  punch(fan(p.x,p.y,0,Math.PI*2,120,130),p.x,p.y,130,0.9*fl);
  punch(fan(p.x,p.y,p.face-0.5,p.face+0.5,70,520),p.x,p.y,520,1*fl);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(dk,0,0);

  if(joy.on){
    ctx.strokeStyle='rgba(200,210,220,.35)';ctx.lineWidth=2*DPR;
    ctx.beginPath();ctx.arc(joy.ox*DPR,joy.oy*DPR,50*DPR,0,7);ctx.stroke();
    ctx.fillStyle='rgba(200,210,220,.3)';
    const kx=joy.cx-joy.ox,ky=joy.cy-joy.oy,km=Math.min(50,Math.hypot(kx,ky)),ka=Math.atan2(ky,kx);
    ctx.beginPath();ctx.arc((joy.ox+Math.cos(ka)*km)*DPR,(joy.oy+Math.sin(ka)*km)*DPR,20*DPR,0,7);ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
