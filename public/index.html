<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THE LAST PLAYER</title>
<style>
html,body{margin:0;height:100%;background:#050607;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.75) 100%)}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#hud{position:fixed;top:10px;left:12px;right:12px;color:#9aa4ae;font-size:12px;letter-spacing:.12em;pointer-events:none;line-height:1.6}
#room{color:#e0e6ec;font-size:14px}
#net{color:#7fb88f}
#role{font-size:13px;font-weight:700}
#obj{color:#cfd6dd;letter-spacing:.04em;margin-top:2px}
#time{position:fixed;top:10px;right:14px;color:#e0e6ec;font-size:18px;font-weight:700;letter-spacing:.1em;pointer-events:none}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;color:#fff;font-size:26px;font-weight:800;letter-spacing:.2em;pointer-events:none;opacity:0;transition:opacity .6s;text-shadow:0 0 20px rgba(0,0,0,.9)}
#banner small{display:block;font-size:13px;font-weight:500;letter-spacing:.1em;color:#b8c0c8;margin-top:8px}
#toast{position:fixed;left:0;right:0;bottom:130px;text-align:center;color:#ffb4b4;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s}
.panel{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(320px,86vw);display:none;z-index:5;touch-action:none}
.btn{display:block;width:100%;padding:18px 0;border:2px solid #5a6672;border-radius:14px;background:rgba(20,26,32,.85);color:#e6ebf0;font-size:16px;font-weight:700;letter-spacing:.14em;touch-action:none;-webkit-user-select:none;user-select:none}
.btn:disabled{opacity:.4}
.btn.hot{border-color:#c0392b;color:#ffd6d0}
.btn.good{border-color:#3fa66b;color:#d4ffe6}
#bar{height:10px;border-radius:6px;background:#1b2229;margin-bottom:8px;overflow:hidden}
#barIn{height:100%;width:0;background:#c0392b}
#enTxt{color:#d9a9a2;font-size:12px;letter-spacing:.1em;margin-bottom:6px;text-align:center}
#end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.82);z-index:10;text-align:center;padding:24px}
#endT{color:#fff;font-size:28px;font-weight:800;letter-spacing:.18em;margin-bottom:10px}
#endS{color:#b8c0c8;font-size:14px;letter-spacing:.06em;margin-bottom:6px}
#endC{font-size:15px;font-weight:700;margin-bottom:26px}
#end .btn{width:min(280px,80vw)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fx"></div>
<div id="grain"></div>
<div id="hud">THE LAST PLAYER · PROTOTYPE v0.5<br>Move: WASD / arrows, or drag your finger<br><span id="net">Connecting...</span><br><span id="room"></span><br><span id="role"></span><div id="obj"></div></div>
<div id="time"></div>
<div id="banner"></div>
<div id="toast"></div>
<div class="panel" id="startP"><button class="btn good" id="startBtn">START GAME</button></div>
<div class="panel" id="repP"><button class="btn good" id="repBtn">HOLD TO REPAIR</button></div>
<div class="panel" id="termP"><button class="btn good" id="termBtn">HOLD TO ACTIVATE</button></div>
<div class="panel" id="ctlP"><div id="enTxt"></div><div id="bar"><div id="barIn"></div></div><button class="btn hot" id="lightsBtn">LIGHTS OFF (2)</button></div>
<div id="end"><div id="endT"></div><div id="endS"></div><div id="endC"></div><button class="btn good" id="againBtn">PLAY AGAIN</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dx=dk.getContext('2d');
const $=id=>document.getElementById(id);
const roomEl=$('room'),netEl=$('net'),roleEl=$('role'),objEl=$('obj'),bannerEl=$('banner'),toastEl=$('toast'),timeEl=$('time');
const startP=$('startP'),repP=$('repP'),ctlP=$('ctlP'),termP=$('termP');
const startBtn=$('startBtn'),repBtn=$('repBtn'),lightsBtn=$('lightsBtn'),termBtn=$('termBtn'),againBtn=$('againBtn');
const endEl=$('end'),endT=$('endT'),endS=$('endS'),endC=$('endC');
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=dk.width=Math.floor(W*DPR);
  cv.height=dk.height=Math.floor(H*DPR);
}
addEventListener('resize',resize);resize();

/* ---------- MAP ---------- */
const T=48,GW=80,GH=50;
const g=new Uint8Array(GW*GH).fill(1);
const rid=new Uint8Array(GW*GH).fill(99);
const rooms=[
 [4,38,14,8,'Entrance',200],[22,38,12,8,'Security',210],
 [4,20,18,14,'Laboratory',160],[26,22,12,12,'Storage',30],
 [44,36,16,10,'Medical Wing',170],[64,36,12,10,'Generator Room',45],
 [64,18,12,14,'Server Room',230],[26,4,12,10,'Elevator',270],
 [44,4,16,12,'Control Room',0],[64,4,12,8,'Extraction',120]
];
const corridors=[
 [18,41,4,3],[34,41,10,3],[60,41,4,3],[10,34,4,4],[22,26,4,3],
 [28,34,4,4],[30,14,4,8],[38,8,6,3],[60,8,12,3],[68,11,4,7],
 [68,32,4,4],[38,28,12,3],[46,31,4,5]
];
function carve(x,y,w,h,id){
  for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++){g[j*GW+i]=0;rid[j*GW+i]=id;}
}
for(const c of corridors)carve(c[0],c[1],c[2],c[3],99);
rooms.forEach((r,i)=>carve(r[0],r[1],r[2],r[3],i));
const props=[];
for(const r of rooms){props.push([r[0]+1,r[1]+1],[r[0]+r[2]-2,r[1]+r[3]-2]);}
props.push([10,24],[14,24],[10,29],[14,29]);
props.push([50,8],[53,8],[50,11],[53,11]);
props.push([67,22],[67,24],[72,22],[72,24],[67,27],[72,27]);
for(const q of props)g[q[1]*GW+q[0]]=2;

function isFloor(i,j){return i>=0&&j>=0&&i<GW&&j<GH&&g[j*GW+i]!==1;}
const blockers=[];
for(let j=0;j<GH;j++){
  let i=0;
  while(i<GW){
    if(g[j*GW+i]===1&&(isFloor(i-1,j)||isFloor(i+1,j)||isFloor(i,j-1)||isFloor(i,j+1)||isFloor(i-1,j-1)||isFloor(i+1,j-1)||isFloor(i-1,j+1)||isFloor(i+1,j+1))){
      let k=i;
      while(k+1<GW&&g[j*GW+k+1]===1&&(isFloor(k,j-1)||isFloor(k,j+1)||isFloor(k+1,j)||isFloor(k+1,j-1)||isFloor(k+1,j+1)))k++;
      blockers.push({x:i*T,y:j*T,w:(k-i+1)*T,h:T});
      i=k+1;
    }else i++;
  }
}
for(const q of props)blockers.push({x:q[0]*T,y:q[1]*T,w:T,h:T});
const GENX=70*T,GENY=41*T;
const TERMS=[
 {name:'Laboratory',x:13.5*T,y:27.5*T},
 {name:'Server Room',x:70.5*T,y:25.5*T},
 {name:'Control Room',x:52.5*T,y:10.5*T}
];
const TERM_RANGE=110;

/* ---------- PLAYER / INPUT ---------- */
const p={x:11*T+(Math.random()*120-60),y:42*T+(Math.random()*120-60),r:13,face:-Math.PI/2};
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const joy={on:false,id:null,ox:0,oy:0,cx:0,cy:0};
cv.addEventListener('pointerdown',e=>{
  if(joy.on)return;
  joy.on=true;joy.id=e.pointerId;joy.ox=joy.cx=e.clientX;joy.oy=joy.cy=e.clientY;
});
cv.addEventListener('pointermove',e=>{if(e.pointerId===joy.id){joy.cx=e.clientX;joy.cy=e.clientY;}});
function endJoy(e){if(e.pointerId===joy.id){joy.on=false;joy.id=null;}}
cv.addEventListener('pointerup',endJoy);
cv.addEventListener('pointercancel',endJoy);

/* ---------- GAME STATE (from server) ---------- */
let role=null,endInfo=null;
let st={phase:'lobby',power:true,repair:0,need:20,terms:[0,0,0],termNeed:20,leftAt:0};
const en={v:0,max:30,regen:0.05,at:0,cdEnd:0};
function curEn(){return Math.min(en.max,en.v+(performance.now()-en.at)/1000*en.regen);}
let bannerTimer=null,toastTimer=null;
function showBanner(big,small){
  bannerEl.innerHTML=big+'<small>'+small+'</small>';
  bannerEl.style.opacity=1;
  clearTimeout(bannerTimer);
  bannerTimer=setTimeout(()=>{bannerEl.style.opacity=0;},4500);
}
function toast(t){
  toastEl.textContent=t;toastEl.style.opacity=1;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toastEl.style.opacity=0;},2200);
}
function applyState(d){
  const was=st.power,wasPhase=st.phase;
  st.phase=d.phase;st.power=d.power;st.repair=d.repair;st.need=d.need;
  if(d.terms){st.terms=d.terms;st.termNeed=d.termNeed;}
  st.leftAt=performance.now()+(d.left||0);
  if(d.phase==='playing'&&wasPhase==='playing'){
    if(was&&!st.power)toast('The power just went out!');
    if(!was&&st.power)toast('Power restored');
  }
}

/* ---------- NETWORK ---------- */
const params=new URLSearchParams(location.search);
const ROOM=((params.get('room')||'LOBBY').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8))||'LOBBY';
const others=new Map();
let ws=null,myId=null,sendT=0,lastSent='';
function setNet(t){netEl.textContent=t;}
function hueOf(id){return parseInt(String(id).slice(0,4),16)%360;}
function addOther(q){
  if(!q||!q.id)return;
  others.set(q.id,{x:q.x,y:q.y,f:q.f||0,tx:q.x,ty:q.y,tf:q.f||0,hue:hueOf(q.id)});
}
function status(){setNet('Online · Room '+ROOM+' · Players: '+(others.size+1));}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));}
function connect(){
  const proto=location.protocol==='https:'?'wss:':'ws:';
  try{ws=new WebSocket(proto+'//'+location.host+'/ws?room='+ROOM);}
  catch(e){setNet('Offline');return;}
  ws.onopen=()=>status();
  ws.onmessage=ev=>{
    let d;try{d=JSON.parse(ev.data);}catch(e){return;}
    if(d.t==='welcome'){
      myId=d.id;others.clear();for(const q of d.players)addOther(q);
      role=d.role;if(d.state)applyState(d.state);
      status();
      if(role==='survivor')showBanner('YOU ARE A SURVIVOR','A game is already running');
    }
    else if(d.t==='join'){addOther(d.p);status();}
    else if(d.t==='move'){
      const o=others.get(d.id);
      if(o){o.tx=d.x;o.ty=d.y;o.tf=d.f;}else addOther(d);
    }
    else if(d.t==='leave'){others.delete(d.id);status();}
    else if(d.t==='role'){
      role=d.role;endInfo=null;
      if(role==='controller'){
        en.v=d.energy;en.max=d.max;en.regen=d.regen;en.at=performance.now();en.cdEnd=0;
        showBanner('YOU ARE THE CONTROLLER','Stop them activating the terminals. Do not get caught.');
      }else{
        showBanner('YOU ARE A SURVIVOR','Activate all 3 terminals before time runs out.');
      }
    }
    else if(d.t==='state'){applyState(d);}
    else if(d.t==='energy'){
      en.v=d.energy;en.max=d.max;en.regen=d.regen;en.at=performance.now();en.cdEnd=performance.now()+d.cdMs;
    }
    else if(d.t==='end'){endInfo=d;}
    else if(d.t==='deny'){toast(d.why);}
  };
  ws.onclose=()=>{setNet('Disconnected · retrying...');others.clear();setTimeout(connect,2000);};
  ws.onerror=()=>{try{ws.close();}catch(e){}};
}
connect();

/* ---------- BUTTONS ---------- */
startBtn.addEventListener('click',()=>send({t:'start'}));
againBtn.addEventListener('click',()=>send({t:'start'}));
lightsBtn.addEventListener('click',()=>send({t:'lights_off'}));
let repTimer=null,termTimer=null,termIdx=-1;
function holdStart(kind){
  if(kind==='rep'){
    if(repTimer)return;
    send({t:'repair'});repTimer=setInterval(()=>send({t:'repair'}),400);
  }else{
    if(termTimer)return;
    send({t:'terminal',i:termIdx});termTimer=setInterval(()=>send({t:'terminal',i:termIdx}),400);
  }
}
function holdStop(){
  clearInterval(repTimer);repTimer=null;
  clearInterval(termTimer);termTimer=null;
}
repBtn.addEventListener('pointerdown',e=>{e.preventDefault();holdStart('rep');});
termBtn.addEventListener('pointerdown',e=>{e.preventDefault();holdStart('term');});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{
  repBtn.addEventListener(ev,holdStop);
  termBtn.addEventListener(ev,holdStop);
});

/* ---------- LIGHT ---------- */
let segs=[];
function cast(px,py,a,maxD){
  const rx=Math.cos(a),ry=Math.sin(a);let best=maxD;
  for(const s of segs){
    const sx=s[2]-s[0],sy=s[3]-s[1];
    const den=rx*sy-ry*sx;
    if(Math.abs(den)<1e-9)continue;
    const t=((s[0]-px)*sy-(s[1]-py)*sx)/den;
    const u=((s[0]-px)*ry-(s[1]-py)*rx)/den;
    if(t>0&&t<best&&u>=0&&u<=1)best=t;
  }
  return best;
}
function fan(px,py,a0,a1,n,maxD){
  const pts=[];
  for(let i=0;i<=n;i++){
    const a=a0+(a1-a0)*i/n,d=cast(px,py,a,maxD);
    pts.push([px+Math.cos(a)*d,py+Math.sin(a)*d]);
  }
  return pts;
}
function punch(pts,px,py,r,alpha){
  dx.beginPath();dx.moveTo(px,py);
  for(const q of pts)dx.lineTo(q[0],q[1]);
  dx.closePath();
  const gr=dx.createRadialGradient(px,py,0,px,py,r);
  gr.addColorStop(0,'rgba(0,0,0,'+alpha+')');
  gr.addColorStop(0.7,'rgba(0,0,0,'+(alpha*0.6)+')');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  dx.fillStyle=gr;dx.fill();
}

/* ---------- LOOP ---------- */
let near=[],last=performance.now(),flickT=0,fl=1;
function resolve(){
  for(const b of near){
    const cx=Math.max(b.x,Math.min(p.x,b.x+b.w));
    const cy=Math.max(b.y,Math.min(p.y,b.y+b.h));
    const ox=p.x-cx,oy=p.y-cy,d=Math.hypot(ox,oy);
    if(d<p.r){
      if(d>0.0001){p.x+=ox/d*(p.r-d);p.y+=oy/d*(p.r-d);}
      else p.x+=p.r;
    }
  }
}
function drawPerson(x,y,face,fill,dot){
  ctx.fillStyle='rgba(0,0,0,.45)';
  ctx.beginPath();ctx.ellipse(x+3,y+5,p.r,p.r*0.8,0,0,7);ctx.fill();
  ctx.fillStyle=fill;
  ctx.beginPath();ctx.arc(x,y,p.r,0,7);ctx.fill();
  ctx.fillStyle=dot;
  ctx.beginPath();ctx.arc(x+Math.cos(face)*p.r*0.6,y+Math.sin(face)*p.r*0.6,4,0,7);ctx.fill();
}
function drawGenerator(){
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(GENX-26,GENY-20,56,50);
  ctx.fillStyle='#3a4046';ctx.fillRect(GENX-28,GENY-26,56,50);
  ctx.strokeStyle='#59636d';ctx.lineWidth=3;ctx.strokeRect(GENX-28,GENY-26,56,50);
  ctx.fillStyle=st.power?'#3fd07a':'#e04a3a';
  ctx.beginPath();ctx.arc(GENX,GENY-8,7,0,7);ctx.fill();
  if(!st.power&&st.repair>0){
    ctx.fillStyle='#1b2229';ctx.fillRect(GENX-22,GENY+6,44,6);
    ctx.fillStyle='#e0b43a';ctx.fillRect(GENX-22,GENY+6,44*Math.min(1,st.repair/st.need),6);
  }
}
function drawTerminals(){
  for(let i=0;i<TERMS.length;i++){
    const t=TERMS[i],v=st.terms[i]||0,done=v>=st.termNeed;
    ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(t.x-20,t.y-12,44,34);
    ctx.fillStyle='#2f353b';ctx.fillRect(t.x-22,t.y-18,44,34);
    ctx.strokeStyle='#59636d';ctx.lineWidth=3;ctx.strokeRect(t.x-22,t.y-18,44,34);
    ctx.fillStyle=done?'#3fd07a':(!st.power?'#3a2a2a':'#d9a43a');
    ctx.fillRect(t.x-16,t.y-13,32,16);
    if(!done&&v>0){
      ctx.fillStyle='#1b2229';ctx.fillRect(t.x-18,t.y+6,36,5);
      ctx.fillStyle='#3fd07a';ctx.fillRect(t.x-18,t.y+6,36*Math.min(1,v/st.termNeed),5);
    }
  }
}
function fmt(ms){
  const s=Math.ceil(ms/1000),m=Math.floor(s/60),r=s%60;
  return m+':'+(r<10?'0':'')+r;
}
function frame(now){
  const dt=Math.min((now-last)/1000,0.05);last=now;
  let vx=0,vy=0;
  if(keys['a']||keys['arrowleft'])vx-=1;
  if(keys['d']||keys['arrowright'])vx+=1;
  if(keys['w']||keys['arrowup'])vy-=1;
  if(keys['s']||keys['arrowdown'])vy+=1;
  if(joy.on){
    const jx=(joy.cx-joy.ox)/50,jy=(joy.cy-joy.oy)/50,mj=Math.hypot(jx,jy);
    if(mj>0.15){vx=jx/Math.max(mj,1);vy=jy/Math.max(mj,1);}
  }
  const m=Math.hypot(vx,vy);
  if(m>1){vx/=m;vy/=m;}

  near=blockers.filter(b=>Math.abs(b.x+b.w/2-p.x)<b.w/2+700&&Math.abs(b.y+b.h/2-p.y)<b.h/2+700);
  if(m>0.01){
    p.x+=vx*200*dt;p.y+=vy*200*dt;resolve();
    const t=Math.atan2(vy,vx);
    const diff=((t-p.face+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    p.face+=diff*Math.min(1,dt*10);
  }
  segs=[];
  for(const b of near)segs.push([b.x,b.y,b.x+b.w,b.y],[b.x+b.w,b.y,b.x+b.w,b.y+b.h],[b.x+b.w,b.y+b.h,b.x,b.y+b.h],[b.x,b.y+b.h,b.x,b.y]);

  sendT+=dt;
  if(sendT>=0.1){
    sendT=0;
    if(ws&&ws.readyState===1){
      const msg=JSON.stringify({t:'move',x:Math.round(p.x),y:Math.round(p.y),f:Math.round(p.face*100)/100});
      if(msg!==lastSent){ws.send(msg);lastSent=msg;}
    }
  }
  for(const o of others.values()){
    const k=Math.min(1,dt*12);
    o.x+=(o.tx-o.x)*k;o.y+=(o.ty-o.y)*k;o.f+=(o.tf-o.f)*k;
  }

  if(flickT<=0&&Math.random()<0.004)flickT=0.15;
  if(flickT>0){flickT-=dt;fl=0.4+Math.random()*0.4;}else fl=1;

  const tx=Math.floor(p.x/T),ty=Math.floor(p.y/T);
  const rI=rid[ty*GW+tx];
  roomEl.textContent=rI===99?'Corridor':rooms[rI][4];

  /* ----- HUD / buttons ----- */
  const playing=st.phase==='playing';
  const ended=st.phase==='ended'&&endInfo;
  roleEl.textContent=role==='controller'?'ROLE: CONTROLLER':role==='survivor'?'ROLE: SURVIVOR':'';
  roleEl.style.color=role==='controller'?'#e0675a':'#7fb88f';
  timeEl.textContent=playing?fmt(Math.max(0,st.leftAt-performance.now())):'';
  const dGen=Math.hypot(p.x-GENX,p.y-GENY);
  let nearT=-1;
  for(let i=0;i<TERMS.length;i++){
    if((st.terms[i]||0)<st.termNeed&&Math.hypot(p.x-TERMS[i].x,p.y-TERMS[i].y)<TERM_RANGE-15)nearT=i;
  }
  const doneN=st.terms.filter(v=>v>=st.termNeed).length;
  if(!playing){
    objEl.textContent=st.phase==='lobby'?(others.size>=1?'Ready. Tap START GAME.':'Waiting for another player...'):'';
  }else if(role==='controller'){
    objEl.textContent='Terminals done: '+doneN+'/3. '+(st.power?'Cut the power to slow them.':'Power is out.');
  }else{
    objEl.textContent=st.power?'Terminals done: '+doneN+'/3. Find: '+TERMS.filter((t,i)=>(st.terms[i]||0)<st.termNeed).map(t=>t.name).join(', '):'POWER OUT. Go to the Generator Room (far east) and hold REPAIR. '+st.repair+'/'+st.need;
  }
  startP.style.display=(st.phase==='lobby'&&others.size>=1)?'block':'none';
  repP.style.display=(playing&&role==='survivor'&&!st.power&&dGen<130)?'block':'none';
  termIdx=nearT;
  termP.style.display=(playing&&role==='survivor'&&st.power&&nearT>=0)?'block':'none';
  ctlP.style.display=(playing&&role==='controller')?'block':'none';
  if(playing&&role==='controller'){
    const e=curEn(),cd=Math.max(0,en.cdEnd-performance.now());
    $('barIn').style.width=(100*e/en.max)+'%';
    $('enTxt').textContent='ENERGY '+e.toFixed(1)+' / '+en.max;
    lightsBtn.disabled=!st.power||cd>0||e<2;
    lightsBtn.textContent=cd>0?'RECHARGING '+Math.ceil(cd/1000)+'s':'LIGHTS OFF (2)';
  }
  if(!playing)holdStop();

  if(ended){
    endEl.style.display='flex';
    const iWon=(endInfo.winner==='survivors'&&role==='survivor')||(endInfo.winner==='controller'&&role==='controller');
    endT.textContent=endInfo.winner==='survivors'?'SURVIVORS WIN':'THE CONTROLLER WINS';
    endT.style.color=iWon?'#7fe0a0':'#e0675a';
    endS.textContent=endInfo.reason;
    if(role==='controller'){endC.textContent='You were the Controller.';endC.style.color='#e0675a';}
    else if(endInfo.controller&&others.has(endInfo.controller)){
      endC.textContent='The Controller was the '+'colored player shown below.';
      endC.style.color='hsl('+hueOf(endInfo.controller)+' 55% 62%)';
      endC.textContent='The Controller was the player with this color.';
    }else{endC.textContent='The Controller has left the room.';endC.style.color='#b8c0c8';}
  }else endEl.style.display='none';

  const camx=p.x-W/2,camy=p.y-H/2;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#050607';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR,0,0,DPR,-camx*DPR,-camy*DPR);
  const i0=Math.max(0,Math.floor(camx/T)),i1=Math.min(GW-1,Math.floor((camx+W)/T)+1);
  const j0=Math.max(0,Math.floor(camy/T)),j1=Math.min(GH-1,Math.floor((camy+H)/T)+1);
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){
    const v=g[j*GW+i],x=i*T,y=j*T;
    if(v===1){
      ctx.fillStyle='#232a31';ctx.fillRect(x,y,T,T);
      if(isFloor(i,j-1)||isFloor(i-1,j)||isFloor(i+1,j)||isFloor(i,j+1)){
        ctx.fillStyle='#3a4651';ctx.fillRect(x,y,T,4);
      }
    }else{
      const id=rid[j*GW+i],l=((i+j)&1)?9:11;
      ctx.fillStyle=id===99?'hsl(215 10% '+(l-1)+'%)':'hsl('+rooms[id][5]+' 14% '+l+'%)';
      ctx.fillRect(x,y,T,T);
      if(v===2){
        ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(x+5,y+7,T-2,T-2);
        ctx.fillStyle='#4a3b2d';ctx.fillRect(x+3,y+3,T-8,T-8);
        ctx.strokeStyle='#6b5642';ctx.lineWidth=3;ctx.strokeRect(x+6,y+6,T-14,T-14);
      }
    }
  }
  drawGenerator();
  drawTerminals();
  for(const o of others.values()){
    drawPerson(o.x,o.y,o.f,'hsl('+o.hue+' 55% 62%)','hsl('+o.hue+' 40% 30%)');
  }
  drawPerson(p.x,p.y,p.face,'#c9d3dc','#7d8a96');

  dx.globalCompositeOperation='source-over';
  dx.setTransform(1,0,0,1,0,0);
  dx.fillStyle=st.power?'rgba(2,3,5,0.93)':'rgba(1,2,3,0.985)';
  dx.fillRect(0,0,dk.width,dk.height);
  dx.setTransform(DPR,0,0,DPR,-camx*DPR,-camy*DPR);
  dx.globalCompositeOperation='destination-out';
  if(rI!==99&&st.power){
    const r=rooms[rI],lx=(r[0]+r[2]/2)*T,ly=(r[1]+r[3]/2)*T;
    punch(fan(lx,ly,0,Math.PI*2,90,260),lx,ly,260,0.4*fl);
  }
  punch(fan(p.x,p.y,0,Math.PI*2,100,st.power?150:110),p.x,p.y,st.power?150:110,0.9*fl);
  const rad=st.power?580:400;
  punch(fan(p.x,p.y,p.face-0.55,p.face+0.55,60,rad),p.x,p.y,rad,1*fl);

  ctx.setTransform(1,0,0,1,0,0);
  ctx.drawImage(dk,0,0);

  if(joy.on){
    ctx.strokeStyle='rgba(200,210,220,.35)';ctx.lineWidth=2*DPR;
    ctx.beginPath();ctx.arc(joy.ox*DPR,joy.oy*DPR,50*DPR,0,7);ctx.stroke();
    ctx.fillStyle='rgba(200,210,220,.3)';
    const kx=joy.cx-joy.ox,ky=joy.cy-joy.oy,km=Math.min(50,Math.hypot(kx,ky)),ka=Math.atan2(ky,kx);
    ctx.beginPath();ctx.arc((joy.ox+Math.cos(ka)*km)*DPR,(joy.oy+Math.sin(ka)*km)*DPR,20*DPR,0,7);ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
